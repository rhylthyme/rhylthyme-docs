site_name: Rhylthyme Documentation
site_description: Documentation for Rhylthyme - A tool for working with real-time program schedules
site_author: Rhylthyme Team
site_url: https://docs.rhylthyme.com/

# Repository
repo_name: rhylthyme/rhylthyme-docs
repo_url: https://github.com/rhylthyme/rhylthyme-docs
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  # Zensical's Material-compatible look; its default "modern" variant differs.
  variant: classic
  custom_dir: overrides
  language: en
  logo: assets/brand/logo.svg
  favicon: assets/brand/logo.svg
  font:
    text: Red Hat Text
    code: JetBrains Mono
  # Colors are set in stylesheets/extra.css (primary/accent: custom).
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Concepts: getting-started/concepts.md
    - Quick Start: getting-started/quick-start.md
    - Examples: getting-started/examples.md
    - Getting the Examples: getting-started/getting-the-examples.md
    - rhylthyme and rhylthyme-mcp: getting-started/rhylthyme-and-rhylthyme-mcp.md
    - Glossary: getting-started/glossary.md
  - Web App:
    - Overview: web-app/index.md
    - Getting Started: web-app/getting-started.md
    - Visualization: web-app/visualization.md
    - Manual Controls: web-app/manual-controls.md
    - Alerts & Notifications: web-app/alerts.md
    - AI Chat: web-app/chat.md
    - Account & Sharing: web-app/account.md
    - MCP Server: web-app/mcp.md
  - Development:
    - Installation: development/installation.md
    - CLI Commands: development/cli.md
    - Command Reference: development/command-reference.md
    - Evaluating Prompts: development/evaluating-prompts.md
    - Program Schema: development/schema.md
    - Environment Schema: development/environment-schema.md
    - Runs Schema: development/runs-schema.md
    - Lab Instruments: development/instruments.md
    - Embed Rhylthyme in your app: development/embedding.md
    - Player events: development/player-events.md
    - Finding codes: development/finding-codes.md
    - Architecture: development/architecture.md
    - Reports:
      - Duration evaluation (catalog): development/reports/duration-evaluation-catalog.md
      - Duration evaluation (synthetic): development/reports/duration-evaluation-synthetic.md
    - Importers:
      - Opentrons (user reference): development/opentrons.md
      - Opentrons (architecture): development/opentrons-architecture.md
      - Ontime run of show: development/ontime.md
    - Contributing: development/contributing.md
  - Legal:
    - Privacy Policy: privacy.md
    - Terms of Service: terms.md
    - Community Guidelines: community-guidelines.md

# The iOS app pages are hidden until their screenshots exist.
exclude_docs: |
  ios-app/**

# Plugins
plugins:
  - search
  # Page dates: tools/page_dates.py (Zensical has no git-revision-date plugin)
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        'installation-guide.md': 'development/installation.md'
        'quick-start-guide.md': 'getting-started/quick-start.md'
        'environment-loading-guide.md': 'getting-started/concepts.md'
        'installation.md': 'getting-started/concepts.md'
        'quick-start.md': 'getting-started/quick-start.md'
        'examples.md': 'getting-started/examples.md'
        'environment-guide.md': 'getting-started/concepts.md'
        'api/cli.md': 'development/cli.md'
        'api/schema.md': 'development/schema.md'
        'api/environment-schema.md': 'development/environment-schema.md'
        'mcp.md': 'web-app/mcp.md'

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhylthyme
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/rhylthyme

# Copyright
copyright: Copyright &copy; 2025-2026 Rhylthyme Team

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: Table of contents
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS
extra_css:
  - stylesheets/extra.css
