{#- Every page: adds Red Hat Display (headings) to the fonts Material loads
    from theme.font, in the same request chain rather than a CSS @import. -#}

{% block fonts %}

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700;800&display=swap">
{% endblock %}
