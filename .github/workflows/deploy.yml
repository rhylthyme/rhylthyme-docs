name: Deploy Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # The "Try it live" overlay bundle (docs/javascripts/playground.bundle.js)
    # is built, not committed: build it before the site so site/ has it.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install Node dependencies
      run: npm ci

    - name: Build the Try it live bundle
      run: npm run build:playground

    # Zensical has no git-revision-date plugin: page_dates.py writes each
    # page's dates into mkdocs.dates.yml, which inherits mkdocs.yml.
    - name: Build documentation
      run: |
        python tools/page_dates.py
        zensical build -f mkdocs.dates.yml

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
